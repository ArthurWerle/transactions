services:
  postgres:
    image: postgres:16-alpine
    container_name: ${POSTGRES_CONTAINER_NAME}
    restart: unless-stopped
    env_file:
      - stack.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - transactions-network

  transaction-service-v2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${SERVICE_CONTAINER_NAME}
    env_file:
      - stack.env
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      SERVER_PORT: ${SERVER_PORT}
      LOG_LEVEL: ${LOG_LEVEL}
      IDENTITY_BASE_URL: ${IDENTITY_BASE_URL:-http://identity:8080}
      # Insight cache invalidation: empty EVENTS_BASE_URL disables it.
      EVENTS_BASE_URL: ${EVENTS_BASE_URL:-}
      INSIGHTS_REBUILD_CALLBACK_URL: ${INSIGHTS_REBUILD_CALLBACK_URL:-http://ai-internal:3005/insights/rebuild}
      INSIGHTS_SIGNIFICANT_AMOUNT: ${INSIGHTS_SIGNIFICANT_AMOUNT:-100}
      INSIGHTS_SIGNIFICANT_MONTH_PERCENT: ${INSIGHTS_SIGNIFICANT_MONTH_PERCENT:-5}
    ports:
      - "${SERVICE_PORT}:${SERVER_PORT}"
    labels:
      prometheus.io/scrape: "true"
      prometheus.io/hostport: "${SERVICE_PORT}"
      prometheus.io/path: "/metrics"
      environment: "production"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - transactions-network
      - bff_back-end

volumes:
  postgres_data:

networks:
  transactions-network:
    driver: bridge
  bff_back-end:
    external: true
